<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clam</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      min-height: 100vh;
    }

    header {
      padding: 24px 20px 16px;
      text-align: center;
      border-bottom: 1px solid #222;
      background: #141414;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #fff;
      margin-bottom: 6px;
    }

    header p {
      font-size: 0.9rem;
      color: #888;
    }

    .search-wrap {
      max-width: 520px;
      margin: 28px auto 0;
      padding: 0 20px;
    }

    .search-wrap input {
      width: 100%;
      padding: 14px 18px;
      font-size: 1rem;
      border: 1px solid #333;
      border-radius: 12px;
      background: #1a1a1a;
      color: #fff;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-wrap input:focus {
      border-color: #555;
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.05);
    }

    .search-wrap input::placeholder {
      color: #666;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 18px;
      padding: 28px 20px 40px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .game-card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .game-card:hover {
      transform: translateY(-4px);
      border-color: #444;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .game-card img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      background: #222;
      display: block;
    }

    .game-card .info {
      padding: 12px;
    }

    .game-card .name {
      font-size: 0.95rem;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .game-card .desc {
      font-size: 0.75rem;
      color: #777;
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: #666;
      font-size: 1.1rem;
    }

    .count {
      text-align: center;
      color: #555;
      font-size: 0.85rem;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Clam</h1>
    <p>just games</p>
  </header>

  <div class="search-wrap">
    <input type="text" id="search" placeholder="Search games..." autocomplete="off">
    <div class="count" id="count"></div>
  </div>

  <div class="games-grid" id="games"></div>

  <script>
    let games = [];

    async function loadGames() {
      try {
        const res = await fetch('games.json');
        games = await res.json();
        renderGames(games);
      } catch (e) {
        document.getElementById('games').innerHTML = '<div class="empty">Couldn\'t load games.json</div>';
      }
    }

    function renderGames(list) {
      const container = document.getElementById('games');
      const countEl = document.getElementById('count');

      if (list.length === 0) {
        container.innerHTML = '<div class="empty">No games found</div>';
        countEl.textContent = '';
        return;
      }

      countEl.textContent = list.length + (list.length === 1 ? ' game' : ' games');

      container.innerHTML = list.map(g => `
        <a class="game-card" href="${g.file}" target="_blank">
          <img src="${g.thumbnail}" alt="${g.name}" onerror="this.src='assets/thumbnails/placeholder.svg'">
          <div class="info">
            <div class="name">${g.name}</div>
            <div class="desc">${g.description || ''}</div>
          </div>
        </a>
      `).join('');
    }

    document.getElementById('search').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      if (!q) {
        renderGames(games);
        return;
      }
      const filtered = games.filter(g =>
        g.name.toLowerCase().includes(q) ||
        (g.description && g.description.toLowerCase().includes(q)) ||
        (g.tags && g.tags.some(t => t.toLowerCase().includes(q)))
      );
      renderGames(filtered);
    });

    loadGames();
  </script>
</body>
</html>
