<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Packs - Clam</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      min-height: 100vh;
      background-image: url('photo-1559825481-12a05cc00344.avif');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }
    body::before { content:''; position:fixed; inset:0; background:rgba(0,0,0,0.65); z-index:-1; }

    /* ========== PASSWORD GATE ========== */
    #gate { position:fixed; inset:0; background:#0f0f0f; display:flex; align-items:center; justify-content:center; z-index:9999; }
    #gate.hidden { display:none; }
    .gate-box {
      background:#1a1a1a; border:1px solid #333; border-radius:16px;
      padding:32px; width:90%; max-width:360px; text-align:center;
    }
    .gate-box h2 { font-size:1.4rem; margin-bottom:8px; color:#fff; }
    .gate-box p { font-size:0.9rem; color:#888; margin-bottom:20px; }
    .gate-box input {
      width:100%; padding:12px 14px; font-size:1rem;
      border:1px solid #333; border-radius:10px;
      background:#111; color:#fff; outline:none; margin-bottom:12px;
    }
    .gate-box input:focus { border-color:#555; }
    .gate-box button {
      width:100%; padding:12px; font-size:1rem; font-weight:600;
      border:none; border-radius:10px; background:#fff; color:#000; cursor:pointer;
    }
    .gate-box button:hover { background:#ddd; }
    .gate-error { color:#ff6b6b; font-size:0.85rem; margin-top:10px; display:none; }

    /* ========== PACKS PAGE ========== */
    header {
      padding:40px 20px 32px; text-align:center; border-bottom:1px solid rgba(255,255,255,0.08);
      position:relative;
    }
    header::before { content:''; position:absolute; inset:0; background:rgba(0,0,0,0.55); z-index:0; }
    header h1, header p { position:relative; z-index:1; }
    header h1 { font-size:2.4rem; font-weight:700; letter-spacing:-0.5px; color:#fff; margin-bottom:6px; text-shadow:0 2px 8px rgba(0,0,0,0.5); }
    header p { font-size:0.95rem; color:#ddd; text-shadow:0 1px 4px rgba(0,0,0,0.5); }

    .search-wrap {
      max-width:520px; margin:28px auto 0; padding:0 20px;
    }
    .search-wrap input {
      width:100%; padding:14px 18px; font-size:1rem;
      border:1px solid rgba(255,255,255,0.15); border-radius:12px;
      background:rgba(26,26,26,0.8); color:#fff; outline:none; backdrop-filter:blur(6px);
    }
    .search-wrap input:focus { border-color:rgba(255,255,255,0.3); }
    .search-wrap input::placeholder { color:#888; }

    .packs-grid {
      display:grid; grid-template-columns:repeat(auto-fill, minmax(160px, 1fr));
      gap:18px; padding:28px 20px 40px; max-width:1100px; margin:0 auto;
    }
    .pack-card {
      background:rgba(26,26,26,0.85); border:1px solid rgba(255,255,255,0.1);
      border-radius:14px; overflow:hidden; cursor:pointer;
      transition:transform 0.15s, border-color 0.15s; text-decoration:none;
      color:inherit; display:block; backdrop-filter:blur(6px);
    }
    .pack-card:hover { transform:translateY(-4px); border-color:rgba(255,255,255,0.25); }
    .pack-card img { width:100%; aspect-ratio:1; object-fit:cover; background:#222; display:block; }
    .pack-card .info { padding:12px; }
    .pack-card .name { font-size:0.95rem; font-weight:600; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .pack-card .desc { font-size:0.75rem; color:#999; margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .empty { grid-column:1 / -1; text-align:center; padding:60px 20px; color:#aaa; font-size:1.1rem; }
    .count { text-align:center; color:#888; font-size:0.85rem; margin-top:8px; }
  </style>
</head>
<body>
  <!-- PASSWORD GATE -->
  <div id="gate">
    <div class="gate-box">
      <h2>Clam</h2>
      <p>Enter the password to continue</p>
      <input type="password" id="pw" placeholder="Password" autocomplete="off">
      <button onclick="checkPw()">Enter</button>
      <div class="gate-error" id="error">Wrong password</div>
    </div>
  </div>

  <!-- PACKS PAGE -->
  <div id="main">
    <header>
      <h1>Packs</h1>
      <p>Everything you need in one place</p>
    </header>

    <div class="search-wrap">
      <input type="text" id="search" placeholder="Search packs..." autocomplete="off">
      <div class="count" id="count"></div>
    </div>

    <div class="packs-grid" id="packs"></div>
  </div>

  <script>
    // ========== PASSWORD SETTINGS ==========
    const PASSWORD = "sebistheGoatandriphubsy";
    // =======================================

    function checkPw() {
      const input = document.getElementById('pw').value;
      if (input === PASSWORD) {
        sessionStorage.setItem('clam_auth', '1');
        unlock();
      } else {
        document.getElementById('error').style.display = 'block';
        document.getElementById('pw').value = '';
      }
    }
    function unlock() {
      document.getElementById('gate').classList.add('hidden');
      document.getElementById('main').classList.add('visible');
      loadPacks();
    }
    if (sessionStorage.getItem('clam_auth') === '1') unlock();

    // ========== PACKS CODE ==========
    let packs = [];
    async function loadPacks() {
      try {
        const res = await fetch('packs.json');
        packs = await res.json();
        renderPacks(packs);
      } catch (e) {
        document.getElementById('packs').innerHTML = '<div class="empty">Couldn\'t load packs.json</div>';
      }
    }
    function renderPacks(list) {
      const container = document.getElementById('packs');
      const countEl = document.getElementById('count');
      if (list.length === 0) {
        container.innerHTML = '<div class="empty">No packs found</div>';
        countEl.textContent = '';
        return;
      }
      countEl.textContent = list.length + (list.length === 1 ? ' pack' : ' packs');
      container.innerHTML = list.map(p => `
        <div class="pack-card" onclick="downloadPack('${p.repoPath}', '${p.title}')">
          <img src="${p.thumbnail}" alt="${p.title}" onerror="this.src='assets/thumbnails/placeholder.svg'">
          <div class="info">
            <div class="name">${p.title}</div>
            <div class="desc">${p.description || ''}</div>
          </div>
        </div>
      `).join('');
    }

    async function downloadPack(repoPath, title) {
      try {
        const res = await fetch(repoPath);
        const blob = await res.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${title}.zip`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        window.URL.revokeObjectURL(url);
      } catch (e) {
        alert('Failed to download pack. The file might be private or the link is broken.');
      }
    }

    document.getElementById('search').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      if (!q) { renderPacks(packs); return; }
      const filtered = packs.filter(p =>
        p.title.toLowerCase().includes(q) ||
        (p.description && p.description.toLowerCase().includes(q))
      );
      renderPacks(filtered);
    });
  </script>
</body>
</html>
